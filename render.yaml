services:
  - type: web
    name: clarifysql-api
    runtime: python
    plan: free
    buildCommand: "pip install -r web/backend/requirements.txt && python setup_db.py"
    startCommand: "cd web/backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false   # set manually in Render's dashboard -- never commit this
      - key: T2SQL_PROVIDER
        value: groq   # Ollama isn't reachable from a cloud host, force Groq
      - key: ALLOWED_ORIGINS
        sync: false   # set to your deployed frontend URL once you have it
